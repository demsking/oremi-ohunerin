[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "oremi-ohunerin"
version = "2.0.1"
description = "Real-time ambient sound and wake word detection"
keywords = ["sound", "detection", "wakeword"]
authors = ["Sébastien Demanou <demsking@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://gitlab.com/demsking/oremi-ohunerin"
documentation = "https://gitlab.com/demsking/oremi-ohunerin/-/blob/main/README.md"
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: French",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.11",
]

include = [
  "config.json",
  "models/**/*",
  "schemas/**/*",
]

packages = [
  { include = "ohunerin" },
]

[tool.poetry.scripts]
oremi-ohunerin = 'ohunerin:main'

[tool.poetry.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Source" = "https://gitlab.com/demsking/oremi-ohunerin"
"Tracker" = "https://gitlab.com/demsking/oremi-ohunerin/-/issues"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pocketsphinx = "^5.0.4"
numpy = "^2.2.2"
tflite-runtime = "^2.13.0"
tflite-support = "^0.4.4"
oremi-core = "^1.2.1"
dataclasses-json = "^0.6.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
pluggy = "^1.0.0"
pytest-asyncio = "^0.25.2"

[tool.pytest.ini_options]
# Function starting with the following pattern are considered for test cases.
python_functions = "test_"

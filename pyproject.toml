[project]
name = "oremi-ohunerin"
version = "4.0.0b7"
description = "Real-time ambient sound and wake word detection"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sébastien Demanou", email = "demsking@gmail.com" }
]
keywords = ["sound", "detection", "wakeword"]

classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: French",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "pocketsphinx>=5.0.4,<6.0.0",
  "numpy>=2.2.2,<3.0.0",
  "tflite-runtime>=2.13.0,<3.0.0",
  "tflite-support>=0.4.4,<0.5.0",
  "pydantic>=2.11.1,<3.0.0",
  "websockets>=16.1.1",
  "pydantic-settings>=2.14.2",
]

[project.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Documentation" = "https://demsking.gitlab.io/oremi-ohunerin"
"Source" = "https://gitlab.com/demsking/oremi-ohunerin"
"Tracker" = "https://gitlab.com/demsking/oremi-ohunerin/-/issues"

[project.scripts]
oremi-ohunerin = "ohunerin:main"

[dependency-groups]
dev = [
  "aiohttp>=3.9.0",
  "autopep8>=2.3.2",
  "bandit>=1.8.3",
  "pylint>=4.0.6",
  "pyroma>=5.0.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "reorder-python-imports>=3.14.0",
  "sounddevice>=0.5.3",
  "trio>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohunerin", "htdocs", "models", "LICENSE", "DOCUMENTATION.md", "wakeword.json", "sounds.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 2

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "I001"]

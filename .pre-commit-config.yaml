# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=13000']
      - id: check-ast
      - id: check-case-conflict
      # - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: double-quote-string-fixer
      - id: name-tests-test
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        files: \.py$
        args: [
          '--license-filepath', 'LICENSE_HEADER.txt',
          '--comment-style', '',
          '--use-current-year',
          '--no-extra-eol',
        ]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.28.4
    hooks:
      - id: check-gitlab-ci
      - id: check-metaschema
        files: ^schemas/.*\.json$
      - id: check-jsonschema
        files: ^oremi_engine/skills/.*/config/.*\.yaml$
        args: ["--schemafile", "schemas/SkillSchema.json"]
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.4.5
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-no-eval
      # - id: python-no-log-warn
      - id: python-use-type-annotations
  - repo: https://github.com/asottile/reorder-python-imports
    rev: v3.12.0
    hooks:
      - id: reorder-python-imports
  - repo: local
    hooks:
      - id: editorconfig-checker
        name: 'Check .editorconfig Rules'
        description: 'Runs `editorconfig-checker` to lint text files according to `.editorconfig` rules.'
        language: system
        entry: editorconfig-checker
        types: [text]
        require_serial: true
      - id: hadolint
        name: 'Dockerfile Linting'
        description: 'Runs `hadolint` to lint Dockerfiles.'
        entry: hadolint
        args: ['--ignore', 'DL3008']
        language: system
        files: Dockerfile
      - id: gimtoc
        name: 'Generate Table of Contents'
        description: 'Runs `gimtoc` to generate a Table of Contents in README.md.'
        entry: gimtoc
        language: node
        files: README.md
        args: [
          '--file', 'README.md',
          '--section', 'Table of Contents',
          '--output', 'README.md',
        ]
      - id: autopep8
        name: 'Fix Python Code Style using AutoPEP8'
        description: 'Runs `autopep8` to format Python code.'
        entry: autopep8
        language: system
        files: '\.py$'
        args: [
          '--in-place',
          '--recursive',
          # Error codes: https://pycodestyle.pycqa.org/en/latest/intro.html#error-codes
          '--ignore', 'E1,E501',
        ]
      # - id: pylint
      #   name: pylint
      #   entry: pylint
      #   language: python
      #   files: '\.py$'
      #   args:
      #     - "-rn" # Only display messages
      #     - "--errors-only"
      #     - "--ignore-paths=tests,.vscode,.gitlab"
      #     - "--ignore-patterns=.*_test\\.py"
  # - repo: https://github.com/PyCQA/bandit
  #   rev: 1.7.6
  #   hooks:
  #     - id: bandit
  #       args: [-c, bandit.yaml]
  - repo: https://github.com/PyCQA/doc8
    rev: v1.1.1
    hooks:
      - id: doc8
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.2
    hooks:
      - id: pyupgrade
        args: [--py311-plus]

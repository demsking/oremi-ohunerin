<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Real-time ambient sound and wake word detection"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Oremi Ohunerin Documentation</title>
    <link
      rel="icon"
      type="image/png"
      href="./favicon.png"
    />
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script type="module">
      const response = await fetch('/openapi.json');
      const openapi = await response.json();
      const isGitlabPage = location.origin.includes('gitlab.io');

      if (isGitlabPage) {
        openapi.servers = [];
      }

      Scalar.createApiReference('#app', {
        title: 'Oremi Ohunerin Documentation',
        agent: {
          disabled: true,
        },
        content: openapi,
        hideClientButton: true,
        hideTestRequestButton: isGitlabPage,
        expandAllModelSections: false,
        showSidebar: true,
        showDeveloperTools: 'localhost',
        operationTitleSource: 'summary',
        theme: 'default',
        persistAuth: false,
        telemetry: false,
        layout: 'modern',
        isEditable: false,
        isLoading: false,
        hideModels: false,
        documentDownloadType: 'both',
        hideSearch: false,
        showOperationId: false,
        hideDarkModeToggle: false,
        withDefaultFonts: true,
        defaultOpenAllTags: false,
        expandAllResponses: false,
        orderSchemaPropertiesBy: 'alpha',
        orderRequiredPropertiesFirst: true,
        default: false,
      });
    </script>
  </body>
</html>

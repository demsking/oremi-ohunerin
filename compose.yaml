---
services:
  detector:
    tty: true
    build: .
    image: demsking/oremi-ohunerin:test
    volumes:
      - ~/.config/oremi/ssl:/etc/ssl:ro
    ports:
      - 35023:5023
    command: [
      "--cert-file", "/etc/ssl/localhost.pem",
      "--key-file", "/etc/ssl/localhost-key.pem",
    ]
    develop:
      watch:
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: build/requirements.txt
        - action: sync+restart
          path: ohunerin
          target: /opt/oremi/ohunerin
        - action: rebuild
          path: bin/
          target: /opt/oremi/bin

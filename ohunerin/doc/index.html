<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Oremi Ohunerin"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Oremi Ohunerin Documentation</title>
    <style>
      .open-api-client-button {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '/openapi.json',
        title: 'Oremi Ohunerin Documentation',
        expandAllModelSections: false,
        defaultOpenAllTags: true,
        hideTestRequestButton: window.location.hostname !== 'localhost',
        hideClientButton: true,
        showSidebar: true,
        showDeveloperTools: 'localhost',
        showToolbar: 'localhost',
        operationTitleSource: 'summary',
        theme: 'default',
        persistAuth: false,
        telemetry: false,
        externalUrls: {},
        default: false,
        layout: 'modern',
        isEditable: false,
        isLoading: false,
        hideModels: false,
        documentDownloadType: 'both',
        hideSearch: false,
        showOperationId: false,
        hideDarkModeToggle: false,
        withDefaultFonts: true,
        defaultOpenFirstTag: true,
        expandAllResponses: false,
        orderSchemaPropertiesBy: 'alpha',
        orderRequiredPropertiesFirst: true,
        agent: {
          disabled: true,
        },
        modelsSectionLabel: 'Models',
        slug: 'oremi-ohunerin-openapi',
      });
    </script>
  </body>
</html>
